# Render Blueprint — deploys the FastAPI backend as a free web service.
# In Render: New → Blueprint → pick this repo. Secrets (sync:false) are entered
# in the dashboard after the first apply.
#
# Postgres is NOT provisioned here — Render's free Postgres expires 30 days
# after creation. DATABASE_URL points at a Neon connection string instead
# (neon.tech, free tier has no expiration), entered as a dashboard secret.
services:
  - type: web
    name: seo-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    plan: free            # sleeps after 15 min idle, ~50s cold start on wake —
                          # the frontend's status polling counts as activity,
                          # so an in-progress report keeps it awake.
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false        # paste the Neon connection string here
      - key: SESSION_SECRET
        generateValue: true
      # --- secrets: set these in the Render dashboard (sync:false) ---
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: AUTH_ALLOWED_DOMAIN
        value: schbang.com
      - key: ADMIN_EMAILS
        value: omkar.rakshe@schbang.com
      - key: AUTH_GOOGLE_CLIENT_ID
        sync: false
      - key: AUTH_GOOGLE_CLIENT_SECRET
        sync: false
      - key: AUTH_REDIRECT_URI
        sync: false        # https://<your-vercel>.vercel.app/api/auth/callback
      - key: FRONTEND_ORIGIN
        sync: false        # https://<your-vercel>.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: GOOGLE_PAGESPEED_API_KEY
        sync: false
      - key: CLARITY_API_TOKEN
        sync: false
      - key: USER_OAUTH_CLIENT_ID
        sync: false
      - key: USER_OAUTH_CLIENT_SECRET
        sync: false
      - key: USER_OAUTH_REFRESH_TOKEN
        sync: false
      - key: CLIENTS_JSON
        sync: false
